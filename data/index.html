    document.getElementById("wifiModal").classList.remove("active");

<!DOCTYPE html>

<body>

<div class="container">
    <span class="admin-login" onclick="openAdminModal()">Admin Login</span>

    <img src="logo.png" class="logo" alt="Logo">
    <h2>Auxtion Hub Portal</h2>

    <label for="ssid">WiFi Network</label>
    <div class="ssid-wrap">
        <input type="text" id="ssid" placeholder="Tap scan to view networks">
        <span class="scan-btn" onclick="openWifiScan()">Scan</span>
    </div>

    <label>Password</label>
    <div class="password-wrap">
        <input type="password" id="password" placeholder="Enter WiFi Password">
        <span class="toggle-pass" onclick="togglePassword()">Show</span>
    </div>

    <label for="deviceId">Device ID</label>
    <input type="text" id="deviceId" placeholder="Enter Device ID">

    <div class="btn-group">
        <button class="save-btn" onclick="saveConfig()">Save</button>
        <button class="cancel-btn" onclick="cancelConfig()">Cancel</button>
    </div>
</div>

<!-- Admin Login Modal -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeAdminModal()">×</button>
        <h2>Admin Login</h2>
        <input type="text" id="adminUser" placeholder="Username">
        <div class="password-wrap">
            <input type="password" id="adminPass" placeholder="Password">
            <span class="toggle-pass" onclick="toggleAdminPassword()">Show</span>
        </div>
        <button style="margin-top: 15px;" onclick="adminLogin()">Login</button>
    </div>
</div>

<!-- WiFi Scan Modal -->
<div class="modal" id="wifiModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeWifiModal()">×</button>
        <h2>Select WiFi</h2>
        <div id="wifiList">Scanning...</div>
    </div>
</div>

<!-- Firmware Card -->
<div class="firmware-card" id="firmwareCard">
    <h3>Device Firmware</h3>
    <p>Current Version: <span id="firmwareVersion">1.0.0</span></p>

    <!-- Firmware update form
    <form method="POST" action="/ota" onsubmit="return confirm('Are you sure you want to update firmware?');">
        <input type="hidden" name="plain" value="update">
        <button type="submit">Update Firmware</button>
    </form> -->
    <form id="otaForm">
        <input type="hidden" name="plain" value="update">
        <button type="button" onclick="submitOtaForm()">Update Firmware</button>
    </form>
</div>

<script>
/* Password toggle */
function togglePassword() {
    const pass = document.getElementById("password");
    const toggle = document.querySelector(".container .toggle-pass");
    pass.type = pass.type === "password" ? "text" : "password";
    toggle.textContent = pass.type === "password" ? "Show" : "Hide";
}

function toggleAdminPassword() {
    const pass = document.getElementById("adminPass");
    const toggle = document.querySelector("#adminModal .toggle-pass");
    pass.type = pass.type === "password" ? "text" : "password";
    toggle.textContent = pass.type === "password" ? "Show" : "Hide";
}

/* Admin modal */
function openAdminModal(){ document.getElementById("adminModal").classList.add("active"); }
function closeAdminModal(){ document.getElementById("adminModal").classList.remove("active"); }

/* WiFi Scan modal */
function openWifiScan(){
    document.getElementById("wifiModal").classList.add("active");
    scanWifiNetworks();
}
function closeWifiModal(){
    document.getElementById("wifiModal").classList.remove("active");
}

/* Scan WiFi Networks */
async function scanWifiNetworks() {
    const wifiList = document.getElementById("wifiList");
    wifiList.innerHTML = "Scanning...";

    try {
        const res = await fetch("/scan");
        const networks = await res.json();

        wifiList.innerHTML = "";
        networks.forEach(n => {
            const div = document.createElement("div");
            div.style.padding = "10px";
            div.style.borderBottom = "1px solid #ddd";
            div.style.cursor = "pointer";
            div.textContent = `${n.ssid} (${n.rssi} dBm)`;
            div.onclick = () => {
                document.getElementById("ssid").value = n.ssid;
                closeWifiModal();
            };
            wifiList.appendChild(div);
        });
    } catch (e) {
        wifiList.innerHTML = "WiFi scan error.";
    }
}

/* Admin login */
function adminLogin(){
    const user = document.getElementById("adminUser").value.trim();
    const pass = document.getElementById("adminPass").value.trim();
    if(user === "admin" && pass === "admin@123"){
        closeAdminModal();
        document.getElementById("firmwareCard").style.display = "block";
        alert("Admin login successful!");
    } else {
        alert("Invalid credentials!");
    }
}
function submitOtaForm(){
    const form = document.getElementById("otaForm");
    const formData = new FormData(form);

    fetch("/ota", { method: "POST", body: formData })
    .then(res => res.text())
    .then(msg => alert(msg))
    .catch(err => alert("Error: " + err));
}
/* Save configuration */
function saveConfig() {
    const ssidInput = document.getElementById("ssid");
    const passInput = document.getElementById("password");
    const devIdInput = document.getElementById("deviceId");

    const ssid = ssidInput.value.trim();
    const password = passInput.value.trim();
    const deviceId = devIdInput.value.trim();

    ssidInput.style.borderColor = "#ddd";
    passInput.style.borderColor = "#ddd";
    devIdInput.style.borderColor = "#ddd";

    let error = false;

    if (!ssid) { ssidInput.style.borderColor = "red"; error = true; }
    if (!password) { passInput.style.borderColor = "red"; error = true; }
    if (!deviceId) { devIdInput.style.borderColor = "red"; error = true; }

    if (error) {
        alert("Please fill all fields before saving.");
        return;
    }

    fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ssid, password, deviceId })
    })
    .then(() => alert("Configuration Saved! Rebooting..."))
    .catch(() => alert("Error saving configuration!"));
}

/* Cancel */
function cancelConfig() {
    document.getElementById("ssid").value = "";
    document.getElementById("password").value = "";
    document.getElementById("deviceId").value = "";
}
</script>

</body>
</html>
